services:
  scheduler:
    image: ghcr.io/ohwhenoh/my-community-crawler:latest
    container_name: task_board_scheduler
    restart: unless-stopped
    command: ["python", "-u", "scheduler_daemon.py"]
    env_file:
      - .env
    environment:
      - IS_DR_NODE=True
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ghcr.io/ohwhenoh/my-community-crawler:latest
    container_name: task_board_bot
    restart: unless-stopped
    command: ["python", "-u", "bot_daemon.py"]
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    command: ["--interval", "300", "--cleanup", "task_board_scheduler", "task_board_bot"]
