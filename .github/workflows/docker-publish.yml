name: Build and Publish to GHCR

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Slack pusher guard (syntax + lint + content checks)
        # 문법이 깨지거나 오늘 고친 오류가 되살아나면 이미지를 만들지 않는다.
        # 가드레일이 없으면 파이도 못 띄운다. (2026-11-23)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pusher guard
        run: |
          python3 -m pip install -r requirements-pusher.txt pyflakes
          python3 -m py_compile slack_pusher.py
          python3 -m pyflakes slack_pusher.py
          python3 slack_pusher_guard.py --check-only slack_pusher.py

      - name: Set up QEMU (for Raspberry Pi arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
